name: ci

# Typecheck every workspace, run the API tests, and build the web app on each
# push, so a change to the shared model cannot quietly break the API or the map.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/gen-palette.mjs --check
      - run: npm run typecheck
      - run: npm run test:api
      # Real Sentinel-2 over a plot in Karnataka, end to end. Informative, not
      # gating: an outage of the public archive must not fail a build.
      - name: Sentinel-2 probe
        continue-on-error: true
        timeout-minutes: 3
        run: npm run build:shared && npm run probe -w @plot/api -- 12.7862 76.7201
      - run: npm run build -w @plot/web
